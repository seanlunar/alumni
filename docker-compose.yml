services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: alumni-app
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
    volumes:
      - ./:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    ports:
      - "9000:9000"
    depends_on:
      - db
      - redis
    networks:
      - alumni-network
    restart: unless-stopped
    command: php-fpm

  nginx:
    image: nginx:alpine
    container_name: alumni-nginx
    ports:
      - "8090:80"
      - "8091:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - alumni-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: alumni-db
    environment:
      POSTGRES_DB: alumni
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - alumni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alumni-redis
    ports:
      - "6380:6379"
    networks:
      - alumni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  alumni-network:
    driver: bridge
